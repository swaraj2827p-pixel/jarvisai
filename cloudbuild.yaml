substitutions:
  _REGION: us-central1
  _SERVICE: jarvisai
  _REPO: jarvis

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$COMMIT_SHA
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$COMMIT_SHA

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$COMMIT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --port=8080
      - --memory=512Mi
      - --cpu=1
      - --min-instances=0
      - --max-instances=2
      # The API itself requires the JARVIS_API_KEY bearer token.
      # Remove this flag to also require Google IAM authentication.
      - --allow-unauthenticated
      - --set-env-vars=HOST=0.0.0.0,LLM_PROVIDER=gemini,GEMINI_MODEL=gemini-2.5-flash,MEMORY_FILE=/tmp/jarvis-memory.json
      - --set-secrets=GEMINI_API_KEY=gemini-api-key:latest,JARVIS_API_KEY=jarvis-api-key:latest

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$COMMIT_SHA

options:
  logging: CLOUD_LOGGING_ONLY
